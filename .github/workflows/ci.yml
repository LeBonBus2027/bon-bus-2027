# Contrôles à chaque modification : neutralité, types, tests unitaires, tests de bout en bout et accessibilité.
# Chaque action est épinglée sur le SHA d'une version publiée depuis au moins deux semaines (chaîne d'approvisionnement) ;
# Dependabot propose les mises à jour (.github/dependabot.yml).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "rapports/**", "maquette/**"]
  pull_request:
    paths-ignore: ["**.md", "rapports/**", "maquette/**"]
  workflow_dispatch:

permissions:
  contents: read

# Une nouvelle modification sur la même branche annule la vérification devenue inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit des dépendances
        run: npm audit --audit-level=moderate
      - name: Neutralité et sécurité du code
        run: node scripts/verifier-neutralite.mjs
      - name: Types
        run: npm run check
      - name: Tests unitaires
        run: npm test

      # Navigateurs de test gardés en cache tant que la version de Playwright ne change pas (gain d'environ 1 minute).
      - name: Version de Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache des navigateurs de test
        id: cache-navigateurs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Navigateurs de test
        if: steps.cache-navigateurs.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Dépendances système des navigateurs
        if: steps.cache-navigateurs.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: Tests de bout en bout et accessibilité (Chrome, Firefox, Safari, mobile)
        run: npm run test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: rapport-playwright
          path: test-results/
          retention-days: 7
