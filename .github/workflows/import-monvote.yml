# Import hebdomadaire des données sources : positions MonVote2027 et moyenne des sondages Pouls (cahier des charges, section 3).
# Rien n'est publié automatiquement : si les données ont changé, une pull request est ouverte avec la liste des changements,
# à relire puis fusionner. La fusion déclenche la CI, qui met le site en ligne si tout passe.
# Actions épinglées sur le SHA d'une version publiée depuis au moins deux semaines (chaîne d'approvisionnement).
# Prérequis : « Allow GitHub Actions to create and approve pull requests » (organisation et dépôt).
name: Import des données

on:
  schedule:
    - cron: "0 6 * * 1"   # chaque lundi à 6 h UTC
  workflow_dispatch:       # ou à la main, depuis l'onglet Actions

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: import-donnees
  cancel-in-progress: false

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  importer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      # Chaque source est importée à part : si l'une échoue (site en panne, page modifiée), l'autre passe quand même,
      # et l'exécution finit en échec pour prévenir.
      - name: Importer les positions MonVote2027
        id: monvote
        continue-on-error: true
        run: node scripts/import-monvote.mjs | tee rapport-monvote.txt
      - name: Importer la moyenne des sondages Pouls
        id: pouls
        continue-on-error: true
        run: node scripts/import-pouls.mjs | tee rapport-pouls.txt

      - name: Y a-t-il du nouveau ?
        id: diff
        run: |
          if git diff --quiet -- data/; then echo "change=non" >> "$GITHUB_OUTPUT"; else echo "change=oui" >> "$GITHUB_OUTPUT"; fi

      # Les pull requests ouvertes avec le jeton du workflow ne relancent pas la CI : on vérifie donc ici.
      # Un échec n'empêche pas la pull request : elle est ouverte quand même, avec un avertissement, pour ne rien rater
      # (par exemple un nouveau candidat sans portrait, ou dont le nom apparaît dans une explication).
      - name: Contrôles (neutralité, types, tests unitaires)
        id: controles
        if: steps.diff.outputs.change == 'oui'
        continue-on-error: true
        run: |
          node scripts/verifier-neutralite.mjs 2>&1 | tee rapport-controles.txt
          npm run check 2>&1 | tail -5 | tee -a rapport-controles.txt
          npm test 2>&1 | tail -30 | tee -a rapport-controles.txt

      - name: Ouvrir une pull request à relire
        if: steps.diff.outputs.change == 'oui'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Une seule pull request d'import à la fois : si la précédente n'est pas encore relue, on la met à jour.
          branche="import-donnees"
          jour="$(date +%d/%m/%Y)"
          git config user.name "import-donnees[bot]"
          git config user.email "import-donnees@users.noreply.github.com"
          git switch -c "$branche"
          git add data/
          git commit -m "Import des données du $jour (MonVote2027, Pouls)"
          git push --force -u origin "$branche"
          {
            echo "Import automatique des données sources."
            echo
            if [ "${{ steps.controles.outcome }}" = "failure" ]; then
              echo "> [!WARNING]"
              echo "> **Les contrôles automatiques ont échoué : ne pas fusionner en l'état.** Le détail est plus bas et dans le journal de cette exécution."
              echo
            fi
            echo "**Positions MonVote2027**"
            echo '```'
            cat rapport-monvote.txt 2>/dev/null || echo "(échec de l'import, voir le journal)"
            echo '```'
            echo "**Moyenne des sondages Pouls**"
            echo '```'
            cat rapport-pouls.txt 2>/dev/null || echo "(échec de l'import, voir le journal)"
            echo '```'
            echo
            echo "À vérifier avant de fusionner :"
            echo "- [ ] chaque position modifiée correspond bien à la page source du candidat sur monvote2027.fr"
            echo "- [ ] aucun candidat ajouté ou retiré par erreur"
            echo "- [ ] un candidat marqué ⚠ franchit le seuil des sondages : vérifier le chiffre sur pouls.app"
            echo
            if [ "${{ steps.controles.outcome }}" = "failure" ]; then
              echo
              echo "**Contrôles en échec**"
              echo '```'
              tail -40 rapport-controles.txt 2>/dev/null
              echo '```'
            fi
            echo
            echo "Une fois fusionnée, la CI vérifie tout et met le site en ligne."
          } > corps-pr.md
          if [ -n "$(gh pr list --head "$branche" --state open --json number --jq '.[].number')" ]; then
            gh pr comment "$branche" --body-file corps-pr.md
          else
            gh pr create --title "Import des données du $jour" --body-file corps-pr.md --base main --head "$branche"
          fi

      - name: Prévenir si une source ou un contrôle a échoué
        if: steps.monvote.outcome == 'failure' || steps.pouls.outcome == 'failure' || steps.controles.outcome == 'failure'
        run: |
          echo "::error::Import en échec — MonVote2027 : ${{ steps.monvote.outcome }}, Pouls : ${{ steps.pouls.outcome }}, contrôles : ${{ steps.controles.outcome }}. Voir le journal ci-dessus."
          exit 1
