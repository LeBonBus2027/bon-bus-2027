# Import hebdomadaire des positions publiées par MonVote2027 (cahier des charges, section 3).
# Rien n'est publié automatiquement : si les données ont changé, une pull request est ouverte avec la liste
# des positions modifiées, à relire et valider avant fusion.
# Actions épinglées sur le SHA d'une version publiée depuis au moins deux semaines (chaîne d'approvisionnement).
# Prérequis : Settings > Actions > General > « Allow GitHub Actions to create and approve pull requests ».
name: Import MonVote2027

on:
  schedule:
    - cron: "0 6 * * 1"   # chaque lundi à 6 h UTC
  workflow_dispatch:       # ou à la main, depuis l'onglet Actions

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: import-monvote
  cancel-in-progress: false

jobs:
  importer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Importer les données
        run: node scripts/import-monvote.mjs | tee rapport-import.txt

      - name: Y a-t-il du nouveau ?
        id: diff
        run: |
          if git diff --quiet -- data/; then echo "change=non" >> "$GITHUB_OUTPUT"; else echo "change=oui" >> "$GITHUB_OUTPUT"; fi

      # Les pull requests ouvertes avec le jeton du workflow ne relancent pas la CI : on vérifie donc ici.
      - name: Contrôles (neutralité, types, tests unitaires)
        if: steps.diff.outputs.change == 'oui'
        run: |
          node scripts/verifier-neutralite.mjs
          npm run check
          npm test

      - name: Ouvrir une pull request à relire
        if: steps.diff.outputs.change == 'oui'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Une seule pull request d'import à la fois : si la précédente n'est pas encore relue, on la met à jour.
          branche="import-monvote"
          git config user.name "import-monvote[bot]"
          git config user.email "import-monvote@users.noreply.github.com"
          git switch -c "$branche"
          git add data/
          git commit -m "Import MonVote2027 du $(date +%d/%m/%Y)"
          git push --force -u origin "$branche"
          if [ -n "$(gh pr list --head "$branche" --state open --json number --jq '.[].number')" ]; then
            gh pr comment "$branche" --body "Mise à jour avec l'import du $(date +%d/%m/%Y) : la liste des positions modifiées est dans le journal de cette exécution."
            exit 0
          fi
          {
            echo "Import automatique des positions publiées par MonVote2027."
            echo
            echo '```'
            cat rapport-import.txt
            echo '```'
            echo
            echo "À vérifier avant de fusionner :"
            echo "- [ ] chaque position modifiée correspond bien à la page source du candidat sur monvote2027.fr"
            echo "- [ ] aucun candidat ajouté ou retiré par erreur"
          } > corps-pr.md
          gh pr create --title "Import MonVote2027 du $(date +%d/%m/%Y)" --body-file corps-pr.md --base main --head "$branche"
