<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Bon Bus — maquette</title>
<style>
  :root {
    --bg: #f6f3ec; --card: #fff; --ink: #1f2328; --quiet: #5c6570; --line: #e3ddd0;
    --road: #e7e1d4; --accent: #e85d2a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  h1 small { font-size: 14px; font-weight: 500; color: var(--quiet); margin-left: 8px; }
  h2 { font-size: 20px; margin: 40px 0 12px; }
  .note { color: var(--quiet); margin: 0; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 14px; }
  .card svg { width: 100%; height: auto; display: block; }
  .card b { display: block; font-size: 15px; }
  .card span { color: var(--quiet); font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  button { font: inherit; font-size: 15px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--ink); background: var(--card); color: var(--ink); cursor: pointer; min-height: 44px; }
  button.primary { background: var(--ink); color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  #status { color: var(--quiet); font-size: 14px; margin-left: 4px; }
  .stage { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  #map { width: 100%; height: auto; display: block; aspect-ratio: 1160 / 840; }
  #reveal { font-size: 18px; margin: 16px 0 4px; min-height: 1.5em; }
  #moral { font-weight: 600; margin: 0 0 12px; }
  #list { padding-left: 22px; margin: 0; columns: 2 260px; font-size: 14px; }
  #list li { break-inside: avoid; padding: 2px 0; }
  #list .bac { color: var(--quiet); }

  .puff { fill: #8a8a8a; opacity: 0; transform-box: fill-box; transform-origin: center; animation: puff 1.8s ease-out infinite; }
  .puff.dark { fill: #4d4d4d; }
  @keyframes puff { 0% { transform: translate(0,0) scale(.4); opacity: .75; } 100% { transform: translate(-28px,-18px) scale(1.8); opacity: 0; } }
  .spark { transform-box: fill-box; transform-origin: center; animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.1); } }
  .fly { animation: buzz 1.2s linear infinite; transform-box: view-box; }
  @keyframes buzz { 0% { transform: translate(0,0); } 25% { transform: translate(6px,-4px); } 50% { transform: translate(0,-8px); } 75% { transform: translate(-6px,-4px); } 100% { transform: translate(0,0); } }
  .bus { transition: opacity .6s; }
  .bus.dim { opacity: .18; }
  .lbl { opacity: 0; transition: opacity .6s; font-size: 22px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 6px; }
  .lbl.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .puff, .spark, .fly { animation: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Le Bon Bus 2027 <small>maquette n°1</small></h1>
  <p class="note">Données fictives : 21 candidats nommés de A à U, des positions et des réponses tirées au hasard. Cette maquette sert à valider le style et l'animation.</p>

  <h2>Les 6 bus</h2>
  <div class="grid" id="grid"></div>

  <h2>Le grand départ</h2>
  <div class="controls">
    <button class="primary" id="go">C'est parti</button>
    <button id="skip" disabled>Passer l'animation</button>
    <button id="new">Nouveau tirage</button>
    <span id="status"></span>
  </div>
  <div class="stage"><svg id="map" viewBox="0 0 1160 840" role="img" aria-label="Plan de ville : ta maison au centre, les bus sur leurs rues"></svg></div>
  <p id="reveal"></p>
  <p id="moral"></p>
  <ol id="list"></ol>
</main>

<script>
"use strict";

/* ---------- Les 6 niveaux de bus ---------- */
const LEVELS = [
  { key: "adore",   bac: "J'adore",              nom: "Autocar de luxe" },
  { key: "bien",    bac: "Plutôt bien",          nom: "Bus neuf" },
  { key: "bof",     bac: "Bof",                  nom: "Bus correct" },
  { key: "pas",     bac: "Plutôt pas",           nom: "Bus cabossé" },
  { key: "jamais",  bac: "Jamais",               nom: "Épave" },
  { key: "inconnu", bac: "Je ne le connais pas", nom: "Bus gris standard" },
];
const BAC = Object.fromEntries(LEVELS.map(l => [l.key, l.bac]));
const WIN_X = [18, 48, 78, 108];

const wheel = (cx, hub, flat) => flat
  ? `<ellipse cx="${cx}" cy="87" rx="15" ry="8" fill="#1d1d1d"/><circle cx="${cx}" cy="86" r="4" fill="${hub}"/>`
  : `<circle cx="${cx}" cy="82" r="13" fill="#1d1d1d"/><circle cx="${cx}" cy="82" r="6" fill="${hub}"/>`;

const crack = x => `<path d="M${x + 5} 30 l7 8 l-3 5 l9 5 M${x + 12} 38 l9 -6" stroke="#fff" stroke-width="1.2" fill="none" opacity=".85"/>`;
const shards = x => `<path d="M${x} 28 l6 8 l5 -8 l5 11 l6 -11 h4 v22 h-26z" fill="#dfe7ea" opacity=".35"/>`;
const puffs = (dark, n) => Array.from({ length: n }, (_, i) =>
  `<circle class="puff${dark ? " dark" : ""}" cx="2" cy="74" r="${dark ? 7 : 5}" style="animation-delay:${(i * 1.8 / n).toFixed(2)}s"/>`).join("");

function shell(o) {
  const wins = WIN_X.map((x, i) =>
    `<rect x="${x}" y="28" width="26" height="22" rx="3" fill="${o.win}"${o.winStroke ? ` stroke="${o.winStroke}" stroke-width="1.5"` : ""}/>` +
    (o.shards ? shards(x) : "") + (o.crack && o.crack.includes(i) ? crack(x) : "")).join("");
  return `<g transform="${o.tilt || ""}">
    <rect x="8" y="16" width="184" height="64" rx="12" fill="${o.body}"/>
    ${o.under || ""}
    ${o.stripe ? `<rect x="8" y="58" width="184" height="7" fill="${o.stripe}"/>` : ""}
    ${wins}
    <rect x="140" y="28" width="18" height="48" rx="2" fill="${o.door}"/>
    <rect x="164" y="26" width="24" height="28" rx="4" fill="${o.win}"${o.winStroke ? ` stroke="${o.winStroke}" stroke-width="1.5"` : ""}/>
    ${o.crack && o.crack.includes(4) ? crack(166) : ""}
    <rect x="184" y="64" width="8" height="6" rx="2" fill="${o.light || "#ffe08a"}"/>
    ${o.bumper === null ? "" : `<rect x="6" y="74" width="188" height="6" rx="3" fill="${o.bumper || "#444"}"/>`}
    ${o.extras || ""}
    ${wheel(46, o.hub, o.flatBack)}${wheel(154, o.hub, false)}
  </g>`;
}

function bus(key) {
  const shadow = `<ellipse cx="100" cy="97" rx="92" ry="4" fill="#000" opacity=".12"/>`;
  switch (key) {
    case "adore": return shadow + shell({
      body: "#1d2b4f", stripe: "#d4af37", win: "#132039", winStroke: "#d9d9d9", door: "#16223f",
      hub: "#f4f4f4", bumper: "#cfcfcf", light: "#fff6c8",
      under: `<rect x="8" y="16" width="184" height="4" rx="2" fill="#d4af37"/>
              <path d="M8 40 L192 22 V30 L8 48z" fill="#fff" opacity=".07"/>`,
      extras: WIN_X.map(x => `<path d="M${x + 3} 48 l11 -18 h5 l-11 18z" fill="#fff" opacity=".18"/>`).join("") +
        `<text x="74" y="72.5" font-size="6.5" font-weight="700" letter-spacing="1.5" fill="#d4af37" text-anchor="middle">GRAND TOURISME</text>`,
    }) + `<path class="spark" d="M14 6 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2z" fill="#d4af37"/>
          <path class="spark" style="animation-delay:.5s" d="M186 4 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 l4 -1.5z" fill="#d4af37"/>
          <path class="spark" style="animation-delay:1s" d="M104 0 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 l4 -1.5z" fill="#d4af37"/>`;

    case "bien": return shadow + shell({
      body: "#2f7de1", stripe: "#ffffff", win: "#bfe3ff", door: "#a6d2f4", hub: "#e2e2e2", bumper: "#2b2b2b",
      extras: WIN_X.map(x => `<path d="M${x + 4} 47 l9 -16 h4 l-9 16z" fill="#fff" opacity=".45"/>`).join(""),
    });

    case "bof": return shadow + shell({
      body: "#e3ad35", win: "#d2e1e7", door: "#c3d4db", hub: "#9a9a9a", bumper: "#4a4a4a",
      extras: `<rect x="20" y="60" width="40" height="8" rx="2" fill="#fff" opacity=".7"/><text x="40" y="66.3" font-size="6" text-anchor="middle" fill="#555">LIGNE 27</text>`,
    });

    case "pas": return shadow + shell({
      body: "#a8956a", win: "#c4ccc4", door: "#b3bcb4", hub: "#727272", bumper: "#5a5a5a", light: "#d9c98a", crack: [1],
      extras: `<path d="M58 66 q11 7 24 0" stroke="#7b6a45" stroke-width="2.5" fill="none"/>
               <circle cx="120" cy="66" r="3" fill="#8a4b20"/><circle cx="126" cy="70" r="2" fill="#8a4b20"/><circle cx="30" cy="22" r="2.5" fill="#8a4b20"/>
               <path d="M84 30 l20 18 M104 30 l-20 18" stroke="#c9b98a" stroke-width="4" opacity=".9"/>
               <ellipse cx="28" cy="77" rx="16" ry="4" fill="#6b5a3a" opacity=".55"/><ellipse cx="128" cy="78" rx="12" ry="3" fill="#6b5a3a" opacity=".55"/>`,
    }) + `<g>${puffs(false, 2)}</g>`;

    case "jamais": return shadow + shell({
      tilt: "rotate(3 100 85)", body: "#7b5e45", win: "#2a2a2a", door: "#151515", hub: "#4f4f4f",
      bumper: null, light: "#3e3e3e", shards: true, crack: [0, 2, 4], flatBack: true,
      under: `<rect x="28" y="52" width="36" height="20" fill="#6f7f62" transform="rotate(-5 46 62)"/>
              <rect x="96" y="54" width="28" height="20" fill="#a06a3a"/>
              <circle cx="99" cy="57" r="1.2" fill="#333"/><circle cx="121" cy="57" r="1.2" fill="#333"/><circle cx="99" cy="71" r="1.2" fill="#333"/><circle cx="121" cy="71" r="1.2" fill="#333"/>
              <circle cx="20" cy="24" r="4" fill="#5c3317"/><circle cx="70" cy="20" r="3" fill="#5c3317"/><circle cx="176" cy="70" r="4" fill="#5c3317"/><circle cx="132" cy="22" r="3.5" fill="#5c3317"/>`,
      extras: `<rect x="80" y="31" width="22" height="12" fill="#f2f2f2"/><text x="91" y="40.5" font-size="8" text-anchor="middle" font-weight="700" fill="#c0392b">HS</text>
               <path d="M22 70 c6 -8 10 6 16 -2 s8 6 14 -3" stroke="#d1335b" stroke-width="2" fill="none"/>
               <rect x="6" y="74" width="80" height="6" rx="3" fill="#4a4a4a"/>
               <rect x="120" y="74" width="72" height="6" rx="3" fill="#4a4a4a" transform="rotate(9 120 77)"/>`,
    }) + `<g>${puffs(true, 4)}</g>
          <circle class="fly" cx="150" cy="8" r="1.6" fill="#222"/><circle class="fly" style="animation-delay:.4s" cx="160" cy="14" r="1.6" fill="#222"/>`;

    default: return shadow + shell({
      body: "#9aa3ad", win: "#d9dee3", door: "#c4cbd2", hub: "#bdbdbd", bumper: "#6b7179",
      extras: `<text x="62" y="73" font-size="16" font-weight="700" text-anchor="middle" fill="#fff" opacity=".9">?</text>`,
    });
  }
}

document.getElementById("grid").innerHTML = LEVELS.map(l => `
  <div class="card">
    <svg viewBox="-34 -8 240 112" role="img" aria-label="${l.nom}">${bus(l.key)}</svg>
    <b>${l.nom}</b><span>Bac « ${l.bac} »</span>
  </div>`).join("");

/* ---------- Données fictives ---------- */
const rnd = () => crypto.getRandomValues(new Uint32Array(1))[0] / 2 ** 32;
const gauss = () => Math.sqrt(-2 * Math.log(rnd() + 1e-12)) * Math.cos(2 * Math.PI * rnd());
const likert = v => Math.max(-2, Math.min(2, Math.round(v)));

// Règle validée : +2 même camp même intensité, +1 même camp, 0 si neutre, −1 camps opposés, −2 extrêmes opposés.
function pas(u, p) {
  if (u === null || p === null || u === 0 || p === 0) return 0;
  if (Math.sign(u) === Math.sign(p)) return u === p ? 2 : 1;
  return Math.abs(u) === 2 && Math.abs(p) === 2 ? -2 : -1;
}

/* ---------- La ville ---------- */
const COLS = 14, ROWS = 10, B = 80, M = 60, R0 = 10, NQ = 20, SCALE = 0.28;
const HOME = [12, 1], GARE = [6, 5], TERMINUS = [0, 9];
const FULL = [0, 0, M * 2 + (COLS - 1) * B, M * 2 + (ROWS - 1) * B];
const px = ([i, j]) => [M + i * B, M + j * B];
const nk = ([i, j]) => i + "," + j;
const ek = (a, b) => [nk(a), nk(b)].sort().join("|");
const CANAL = 7, BRIDGES = [1, 3, 5, 9, 12];
const PARK = { i: 8, j: 2, w: 2, h: 2 };                       // 2 × 2 pâtés, rues intérieures fermées
const REMOVED = new Set();
for (let i = 0; i < COLS; i++) if (!BRIDGES.includes(i)) REMOVED.add(ek([i, CANAL], [i, CANAL + 1]));
[[8, 3], [10, 3], [9, 2], [9, 4]].forEach(n => REMOVED.add(ek([9, 3], n)));
[[[3, 2], [4, 2]], [[11, 6], [12, 6]], [[2, 4], [2, 5]], [[10, 8], [11, 8]]].forEach(([a, b]) => REMOVED.add(ek(a, b)));
const inGrid = ([i, j]) => i >= 0 && j >= 0 && i < COLS && j < ROWS;
const hasEdge = (a, b) => inGrid(a) && inGrid(b) && !REMOVED.has(ek(a, b));
const isMain = (a, b) => (a[1] === b[1] && a[1] === 5) || (a[0] === b[0] && a[0] === 6) || (a[1] === b[1] && a[1] === 1 && a[0] >= 6);

// Un chemin au hasard qui se rapproche à chaque carrefour de sa cible, en respectant canal, parc et impasses.
function stair(a, b) {
  for (let t = 0; t < 500; t++) {
    let cur = a; const path = [a];
    while (cur[0] !== b[0] || cur[1] !== b[1]) {
      const dx = Math.sign(b[0] - cur[0]), dy = Math.sign(b[1] - cur[1]);
      const opts = [dx && [cur[0] + dx, cur[1]], dy && [cur[0], cur[1] + dy]].filter(n => n && hasEdge(cur, n));
      if (!opts.length) break;
      cur = opts[Math.floor(rnd() * opts.length)]; path.push(cur);
    }
    if (cur[0] === b[0] && cur[1] === b[1]) return path;
  }
  throw new Error("aucun chemin");
}

// Ligne d'un bus : chez toi → gare (10 arrêts) → terminus opposé (10 arrêts). d = arrêts depuis chez toi.
function makeRoutes(n) {
  const seen = new Set(), routes = [];
  for (let t = 0; routes.length < n && t < 2000; t++) {
    const inward = stair(HOME, GARE), k = inward.map(nk).join(";");
    if (seen.has(k) && t < 1500) continue;
    seen.add(k);
    routes.push(inward.concat(stair(GARE, TERMINUS).slice(1)));
  }
  return routes;
}

function at(route, d) {
  d = Math.max(0, Math.min(route.length - 1, d));
  const k = Math.min(Math.floor(d), route.length - 2), f = d - k;
  const [ax, ay] = px(route[k]), [bx, by] = px(route[k + 1]);
  return { x: ax + (bx - ax) * f, y: ay + (by - ay) * f, ang: Math.atan2(ay - by, ax - bx), k, f };
}

/* ---------- Tirage fictif ---------- */
let S = null;

function draw() {
  const qv = Array.from({ length: NQ }, () => [gauss(), gauss()]);
  const cands = Array.from({ length: 21 }, (_, i) => {
    const a = rnd() * 2 * Math.PI, m = 0.5 + rnd() * 1.2;
    return { name: "Candidat " + String.fromCharCode(65 + i), lat: [Math.cos(a) * m, Math.sin(a) * m], lane: ((i % 5) - 2) * 3 };
  });
  cands.forEach(c => c.pos = qv.map(q => rnd() < 0.05 ? null : likert((c.lat[0] * q[0] + c.lat[1] * q[1]) * 1.3 + (rnd() - .5) * .8)));
  makeRoutes(cands.length).forEach((r, i) => cands[i].route = r);

  const ua = rnd() * 2 * Math.PI, um = 0.7 + rnd();
  const user = qv.map(q => rnd() < 0.08 ? null : likert((Math.cos(ua) * um * q[0] + Math.sin(ua) * um * q[1]) * 1.3 + (rnd() - .5) * 1.2));

  const weights = [["adore", 2], ["bien", 4], ["bof", 5], ["pas", 5], ["jamais", 4], ["inconnu", 1]];
  const total = weights.reduce((s, w) => s + w[1], 0);
  cands.forEach(c => { let t = rnd() * total; c.level = weights.find(w => (t -= w[1]) < 0)[0]; });
  const shuffled = [...cands].sort(() => rnd() - .5);
  if (!cands.some(c => c.level === "adore")) shuffled[0].level = "adore";
  if (!cands.some(c => c.level === "jamais")) shuffled[1].level = "jamais";

  cands.forEach(c => c.d = R0);
  S = { cands, user, running: false, skip: false, done: false, view: FULL };
  renderMap();
  setView(FULL);
  ["reveal", "moral", "list"].forEach(id => document.getElementById(id).innerHTML = "");
  document.getElementById("status").textContent = `${user.filter(u => u !== null).length} réponses sur ${NQ}`;
  document.getElementById("go").disabled = false;
  document.getElementById("go").textContent = "C'est parti";
}

/* ---------- Carte ---------- */
const svgEl = document.getElementById("map");
const C = { land: "#f3f1ec", block: "#e6e3db", park: "#c9e7bd", tree: "#a9d69a", water: "#a8d3e6",
            road: "#ffffff", roadEdge: "#d8d3c8", main: "#fde9a8", mainEdge: "#eec56a", label: "#6f6a60" };

function renderMap() {
  const [W, H] = [FULL[2], FULL[3]];
  let g = `<rect x="-400" y="-400" width="${W + 800}" height="${H + 800}" fill="${C.land}"/>`;

  // Pâtés de maisons (y compris au-delà du bord, pour que la ville continue).
  for (let i = -1; i < COLS; i++) for (let j = -1; j < ROWS; j++) {
    if (j === CANAL) continue;
    if (i >= PARK.i && i < PARK.i + PARK.w && j >= PARK.j && j < PARK.j + PARK.h) continue;
    const [x, y] = px([i, j]);
    g += `<rect x="${x + 12}" y="${y + 12}" width="${B - 24}" height="${B - 24}" rx="6" fill="${C.block}"/>`;
  }
  // Parc et canal.
  const [pxl, pyt] = px([PARK.i, PARK.j]), [pxr, pyb] = px([PARK.i + PARK.w, PARK.j + PARK.h]);
  g += `<rect x="${pxl + 12}" y="${pyt + 12}" width="${pxr - pxl - 24}" height="${pyb - pyt - 24}" rx="10" fill="${C.park}"/>`;
  [[0.22, 0.25], [0.7, 0.2], [0.35, 0.72], [0.78, 0.7], [0.5, 0.45]].forEach(([u, v]) =>
    g += `<circle cx="${pxl + u * (pxr - pxl)}" cy="${pyt + v * (pyb - pyt)}" r="9" fill="${C.tree}"/>`);
  const cy = px([0, CANAL])[1];
  g += `<rect x="-400" y="${cy + 16}" width="${W + 800}" height="${B - 32}" fill="${C.water}"/>`;

  // Rues : amorces vers l'extérieur, puis bordures, puis chaussées.
  const edges = [];
  for (let i = 0; i < COLS; i++) for (let j = 0; j < ROWS; j++) {
    [[i + 1, j], [i, j + 1]].forEach(n => hasEdge([i, j], n) && edges.push([[i, j], n]));
  }
  const stubs = [];
  for (let i = 0; i < COLS; i++) stubs.push([[i, 0], [i, -1]], [[i, ROWS - 1], [i, ROWS]]);
  for (let j = 0; j < ROWS; j++) stubs.push([[0, j], [-1, j]], [[COLS - 1, j], [COLS, j]]);
  const seg = ([a, b], w, col) => { const [x1, y1] = px(a), [x2, y2] = px(b);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`; };
  [...stubs, ...edges].forEach(e => g += seg(e, isMain(...e) ? 26 : 21, isMain(...e) ? C.mainEdge : C.roadEdge));
  [...stubs, ...edges].forEach(e => g += seg(e, isMain(...e) ? 22 : 17, isMain(...e) ? C.main : C.road));

  // Noms de rues (neutres).
  const t = (x, y, s, rot, extra = "") => `<text x="${x}" y="${y}" font-size="11" fill="${C.label}" text-anchor="middle"${rot ? ` transform="rotate(${rot} ${x} ${y})"` : ""} ${extra}>${s}</text>`;
  g += t(px([9, 5])[0], px([9, 5])[1] + 4, "Avenue des Platanes");
  g += t(px([6, 3])[0] + 4, px([6, 3])[1], "Boulevard du Marché", -90);
  g += t(px([2, 3])[0], px([2, 3])[1] + 4, "Rue des Lilas");
  g += t(px([10, 6])[0] + 4, px([10, 6])[1] + 40, "Rue des Écoles", -90);
  g += t(px([3, 1])[0] + 40, px([3, 1])[1] + 4, "Rue du Moulin");
  g += t(W / 2 + 60, cy + B / 2 + 4, "Canal Saint-Pierre", 0, `font-style="italic" fill="#4f86a6"`);
  g += t((pxl + pxr) / 2, (pyt + pyb) / 2 + 4, "Parc des Tilleuls", 0, `fill="#3f7a35" font-weight="600"`);

  g += `<g id="walks"></g><g id="buses">${S.cands.map((c, i) => `<g class="bus" id="b${i}">${bus(c.level)}</g>`).join("")}</g>`;

  // Repères : terminus, gare, chez toi.
  const [tx, ty] = px(TERMINUS), [gx, gy] = px(GARE), [hx, hy] = px(HOME);
  g += `<g transform="translate(${tx} ${ty})"><rect x="-14" y="-14" width="28" height="28" rx="6" fill="#80868b"/><text y="6" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">T</text>
        <text x="20" y="-20" font-size="15" font-weight="600" fill="#5f6368">Terminus</text></g>`;
  g += `<g transform="translate(${gx} ${gy})"><rect x="-17" y="-17" width="34" height="34" rx="8" fill="#1a73e8"/>
        <rect x="-10" y="-9" width="20" height="14" rx="3" fill="#fff"/><rect x="-7" y="-6" width="14" height="5" fill="#1a73e8"/>
        <circle cx="-5" cy="7" r="2.6" fill="#fff"/><circle cx="5" cy="7" r="2.6" fill="#fff"/>
        <text x="24" y="-22" font-size="15" font-weight="600" fill="#1a73e8">Gare routière</text></g>`;
  g += `<g transform="translate(${hx} ${hy})"><path d="M0 0 C-5 -12 -19 -19 -19 -33 A19 19 0 1 1 19 -33 C19 -19 5 -12 0 0z" fill="#ea4335" stroke="#b3261e" stroke-width="1.5"/>
        <path d="M-9 -31 L0 -40 L9 -31 V-24 H-9z" fill="#fff"/>
        <text y="24" font-size="17" font-weight="700" fill="#c5221f" text-anchor="middle" paint-order="stroke" stroke="${C.land}" stroke-width="5">Chez toi</text></g>`;
  g += `<g id="labels"></g>`;

  svgEl.setAttribute("aria-label", "Plan de ville : la gare au centre, ta maison en haut à droite, le terminus en bas à gauche");
  svgEl.innerHTML = g;
  S.cands.forEach((c, i) => { c.el = document.getElementById("b" + i); place(c); });
}

function place(c) {
  const p = at(c.route, c.d);
  const ox = -Math.sin(p.ang) * c.lane, oy = Math.cos(p.ang) * c.lane;   // petit décalage de voie
  const flip = Math.cos(p.ang) < -0.01 ? -1 : 1;                          // jamais la tête en bas
  c.x = p.x + ox; c.y = p.y + oy;
  c.el.setAttribute("transform", `translate(${c.x.toFixed(1)} ${c.y.toFixed(1)}) rotate(${(p.ang * 180 / Math.PI).toFixed(1)}) scale(${SCALE} ${SCALE * flip}) translate(-100 -55)`);
}

function setView(v) { S.view = v; svgEl.setAttribute("viewBox", v.map(n => n.toFixed(1)).join(" ")); }

const ease = t => t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
function tween(ms, step) {
  return new Promise(res => {
    if (S.skip || matchMedia("(prefers-reduced-motion: reduce)").matches) { step(1); return res(); }
    const t0 = performance.now();
    const f = now => { const t = Math.min(1, (now - t0) / ms); step(ease(t)); t < 1 && !S.skip ? requestAnimationFrame(f) : (step(1), res()); };
    requestAnimationFrame(f);
  });
}

/* ---------- Le trajet ---------- */
async function play() {
  if (S.running) return;
  if (S.done) {
    S.cands.forEach(c => { c.d = R0; place(c); c.el.classList.remove("dim"); });
    document.getElementById("walks").innerHTML = document.getElementById("labels").innerHTML = "";
    setView(FULL);
    ["reveal", "moral", "list"].forEach(id => document.getElementById(id).innerHTML = "");
  }
  S.running = true; S.skip = false;
  const go = document.getElementById("go"), skip = document.getElementById("skip"), status = document.getElementById("status");
  go.disabled = true; skip.disabled = false;

  const answered = S.user.map((u, q) => u === null ? -1 : q).filter(q => q >= 0);
  const n = answered.length;
  for (const [k, q] of answered.entries()) {
    if (S.skip) break;
    status.textContent = `Question ${k + 1} sur ${n}`;
    const from = S.cands.map(c => c.d);
    const to = S.cands.map(c => c.d - R0 * pas(S.user[q], c.pos[q]) / (2 * n));
    await tween(380, t => S.cands.forEach((c, i) => { c.d = from[i] + (to[i] - from[i]) * t; place(c); }));
  }
  // Position finale exacte, quel que soit le chemin (et si on a passé l'animation).
  S.cands.forEach(c => {
    const sum = answered.reduce((s, q) => s + pas(S.user[q], c.pos[q]), 0);
    c.d = R0 * (1 - sum / (2 * n)); c.arrets = Math.round(c.d); place(c);
  });
  status.textContent = "Terminus, tout le monde descend.";
  skip.disabled = true;
  await reveal();
  S.running = false; S.done = true;
  go.disabled = false; go.textContent = "Rejouer";
}

async function reveal() {
  const byDist = [...S.cands].sort((a, b) => a.d - b.d || rnd() - .5);
  const best = byDist[0];
  const topBac = S.cands.some(c => c.level === "adore") ? "adore" : "bien";
  const beau = byDist.filter(c => c.level === topBac).at(-1);           // ton plus beau bus le plus éloigné
  const epave = byDist.find(c => c.level === "jamais");                 // ton épave la plus proche
  const focus = [...new Set([...byDist.slice(0, 3), beau, epave].filter(Boolean))];

  S.cands.forEach(c => c.el.classList.toggle("dim", !focus.includes(c)));

  // Trajet à pied, de l'arrêt du bus jusqu'à ta porte (pointillés façon GPS).
  const [hx, hy] = px(HOME);
  document.getElementById("walks").innerHTML = focus.map(c => {
    const p = at(c.route, c.d), pts = [[p.x, p.y]];
    for (let k = p.f > 0 ? p.k : p.k - 1; k >= 0; k--) pts.push(px(c.route[k]));
    if (p.k === 0 && p.f === 0) pts.push([hx, hy]);
    return `<polyline points="${pts.map(q => q.join(",")).join(" ")}" fill="none" stroke="${c === best ? "#1a73e8" : "#80868b"}" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 13" opacity=".9"/>`;
  }).join("");

  // Étiquettes en pastilles, écartées si elles se chevauchent.
  const tags = focus.map(c => {
    const txt = `${c.name.replace("Candidat ", "")} · ${c.arrets} arrêt${c.arrets > 1 ? "s" : ""}`;
    return { c, txt, w: txt.length * 10 + 24, x: c.x, y: c.y - 40 };
  }).sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 20; pass++) for (let i = 0; i < tags.length; i++) for (let j = i + 1; j < tags.length; j++) {
    const a = tags[i], b = tags[j];
    if (Math.abs(a.x - b.x) < (a.w + b.w) / 2 + 6 && Math.abs(a.y - b.y) < 34) { const push = (34 - Math.abs(a.y - b.y)) / 2 + 1; a.y -= push; b.y += push; }
  }
  document.getElementById("labels").innerHTML = tags.map(t => `
    <line x1="${t.c.x}" y1="${t.c.y - 12}" x2="${t.x}" y2="${t.y + 14}" stroke="#3c4043" stroke-width="1.5"/>
    <rect x="${t.x - t.w / 2}" y="${t.y - 15}" width="${t.w}" height="30" rx="15" fill="${t.c === best ? "#1a73e8" : "#fff"}" stroke="#3c4043" stroke-width="1.2"/>
    <text x="${t.x}" y="${t.y + 6}" font-size="17" font-weight="600" text-anchor="middle" fill="${t.c === best ? "#fff" : "#202124"}">${t.txt}</text>`).join("");

  // Zoom sur ta maison, les bus mis en avant et leurs étiquettes, en gardant les proportions de la carte.
  const xs = [hx - 70, hx + 70, ...tags.flatMap(t => [t.x - t.w / 2, t.x + t.w / 2]), ...focus.map(c => c.x)];
  const ys = [hy - 70, hy + 40, ...tags.map(t => t.y - 20), ...focus.map(c => c.y + 30)];
  const pad = 40, ratio = FULL[2] / FULL[3];
  let w = Math.max(...xs) - Math.min(...xs) + 2 * pad, h = Math.max(...ys) - Math.min(...ys) + 2 * pad;
  if (w / h < ratio) w = h * ratio; else h = w / ratio;
  if (w < 600) { w = 600; h = w / ratio; }
  const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2;
  const from = S.view, to = [cx - w / 2, cy - h / 2, w, h];
  S.skip = false;
  await tween(1200, t => setView(from.map((v, i) => v + (to[i] - v) * t)));

  const a = n => `${n} arrêt${n > 1 ? "s" : ""}`;
  const loin = c => c.arrets > R0 ? " Il est même reparti dans l'autre sens, vers le terminus." : "";
  document.getElementById("reveal").textContent = best === beau || best.level === topBac
    ? `Ton intuition était la bonne : ${best.name}, que tu avais mis dans le bac « ${BAC[best.level]} », est le bus qui te rapproche le plus (${a(best.arrets)} à pied).`
    : `Ton plus beau bus (${beau.name}) te laisse à ${a(beau.arrets)} de chez toi.${loin(beau)} Celui qui te rapproche le plus, c'est ${best.name} (${a(best.arrets)}), que tu avais mis dans le bac « ${BAC[best.level]} ».`;
  document.getElementById("moral").textContent = "Aucun bus ne te dépose pile devant chez toi. Prends celui qui te rapproche le plus.";
  document.getElementById("list").innerHTML = byDist.map(c =>
    `<li>${c.name} : ${a(c.arrets)} <span class="bac">(bac « ${BAC[c.level]} »)</span></li>`).join("");
}

document.getElementById("go").onclick = play;
document.getElementById("skip").onclick = () => { S.skip = true; };
document.getElementById("new").onclick = () => { if (!S.running) draw(); };
draw();
</script>
</body>
</html>
